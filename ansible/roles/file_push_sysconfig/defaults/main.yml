---
file_push_sysconfig_owner: root
file_push_sysconfig_group: root

# Payload roots on the controller, lowest precedence first.
# Requires `service_dir` and `host_key` from the generated inventory.
file_push_sources:
  - "{{ service_dir }}/filetree"
  - "{{ service_dir }}/hosts/{{ host_key }}/filetree"
