# Copy to secrets.yml (`pvc init` does this), fill in, then encrypt:
#
#   uv run ansible-vault encrypt secrets.yml
#
# Set PVC_VAULT_PASSWORD_FILE to a file holding the vault password, or pvc asks for
# it when it needs the secrets. Edit later with `uv run ansible-vault edit secrets.yml`.

# Proxmox API token. Datacenter > Permissions > API Tokens > Add.
# Format: user@realm!tokenid=secret
proxmox_api_token: "root@pam!pvc=00000000-0000-0000-0000-000000000000"

# Sudo password for the devops user (hashed into cloud-init; also Ansible's become password).
vault_devops_password: "change-me"

# Only for `pvc site configure` when proxmox.ssh_user is not root and sudo asks for
# a password. Leave unset for root or passwordless sudo.
# proxmox_become_password: "change-me"

# Only for hosts with the nginx role: Cloudflare DNS-01 certificates.
# vault_cloudflare_api_token: "cloudflare_api_token"

# Only for hosts with the gitlab role. Applied on the first package install
# (8 characters minimum). Later resets are done in the GitLab UI.
# vault_gitlab_root_password: "change-me"
