[project]
name = "proxmox-commissioner"
version = "0.2.0"
description = "Manifest-driven Terraform and Ansible wrapper for services on Proxmox VE"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
dependencies = [
    "ansible-core>=2.17",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
pvc = "pvc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pvc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
