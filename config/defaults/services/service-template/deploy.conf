#!/bin/bash
# Playbooks for this service, by phase. Sourced by scripts/service-deploy.sh.
# Names are files under ansible/playbooks/ and run in the order listed.

# Run once on a fresh VM. Auto-skipped when the host is already hardened.
BOOTSTRAP_PLAYBOOKS=(
    00-initial.yml
    10-base-security.yml
)

# Idempotent, run on every deploy as devops@prod_ssh_port.
CONVERGE_PLAYBOOKS=(
    25-file-push.yml
)

# Imperative or non-idempotent. Only runs with --post-deploy.
POSTDEPLOY_PLAYBOOKS=(
    27-post-deploy.yml
)

# Other stages to add to CONVERGE_PLAYBOOKS as the service needs them:
#   01-install-packages.yml           additional_packages from the inventory
#   02-enable-additional-services.yml additional_services from the inventory
#   14-mount-nfs.yml                  nfs_mountpoints from the inventory
#   15-web-server.yml                 nginx and certbot
#   16-webserver-config.yml           nginx sites and TLS certificates
#   20-docker.yml                     Docker engine
#   22-cloudflared.yml                Cloudflare Tunnel client
#   23-node-exporter.yml              Prometheus Node Exporter
#   26-docker-deploy.yml              docker compose up for this service
